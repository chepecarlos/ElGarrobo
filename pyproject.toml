[tool.black]
line-length = 119

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elgarrobo"
description = "Macros para Linux con StreamDeck, teclados USB, MQTT y OBS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ChepeCarlos", email = "chepecarlos@chepecarlos.com" }]
dynamic = ["version", "dependencies"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["macros", "streamdeck", "mqtt", "obs", "linux"]

[project.urls]
Homepage = "https://github.com/chepecarlos/ElGarrobo"
Documentation = "https://github.com/chepecarlos/ElGarrobo/blob/master/Guia_Instalacion.md"
Source = "https://github.com/chepecarlos/ElGarrobo"
Tracker = "https://github.com/chepecarlos/ElGarrobo/issues"

[project.scripts]
elgarrobo = "elGarrobo.main:main"
elgarrobo-tool = "elGarrobo.tool:main"

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-cov>=4.0", "pytest-asyncio>=1.0", "playwright>=1.50"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "testing*"]

[tool.setuptools.package-data]
"elGarrobo.data" = ["*.md"]
"elGarrobo.dispositivos.miteclado" = ["distribuciones/*.json"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
# GUI simulada de nicegui (fixture `user`), sin main.py: las páginas se crean en cada test
addopts = "-p nicegui.testing.user_plugin"
asyncio_mode = "auto"
main_file = ""
